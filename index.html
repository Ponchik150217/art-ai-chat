<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Art AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, #243b80 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #5b247a 0%, transparent 35%),
        #080b14;
    color: #fff;
    height: 100vh;
    overflow: hidden;
}

/* ОСНОВНОЙ ЭКРАН */

.app {
    display: flex;
    height: 100vh;
}

/* ЛЕВАЯ ПАНЕЛЬ */

.sidebar {
    width: 270px;
    background: rgba(10, 13, 24, 0.88);
    border-right: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    padding: 15px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    padding: 12px;
    margin-bottom: 15px;
}

.logo span {
    background: linear-gradient(90deg, #7c5cff, #00d4ff);
    -webkit-background-clip: text;
    color: transparent;
}

.new-chat {
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
    color: white;
    padding: 13px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.25s;
    margin-bottom: 20px;
}

.new-chat:hover {
    background: rgba(124,92,255,0.25);
    transform: translateY(-1px);
}

.history-title {
    color: #888fa5;
    font-size: 13px;
    margin: 5px 10px 10px;
}

.history {
    overflow-y: auto;
    flex: 1;
}

.chat-item {
    padding: 11px 12px;
    border-radius: 9px;
    cursor: pointer;
    color: #d8dbea;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-item:hover {
    background: rgba(255,255,255,0.07);
}

.bottom-menu {
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 10px;
}

.menu-button {
    width: 100%;
    background: transparent;
    border: none;
    color: #c9ccda;
    text-align: left;
    padding: 12px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
}

.menu-button:hover {
    background: rgba(255,255,255,0.07);
}

/* ЧАТ */

.chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* ВЕРХНЯЯ ПАНЕЛЬ */

.topbar {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    background: rgba(8,11,20,0.45);
    backdrop-filter: blur(15px);
}

.model-name {
    font-weight: bold;
    font-size: 17px;
}

.status {
    color: #65e6a7;
    font-size: 12px;
}

/* СООБЩЕНИЯ */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 40px 20px 150px;
}

.welcome {
    max-width: 760px;
    margin: 80px auto 0;
    text-align: center;
}

.welcome-icon {
    width: 70px;
    height: 70px;
    margin: auto auto 20px;
    border-radius: 22px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 35px;
    background: linear-gradient(135deg, #6c4cff, #00c6ff);
    box-shadow: 0 15px 45px rgba(80,70,255,0.35);
}

.welcome h1 {
    font-size: 38px;
    margin-bottom: 12px;
}

.welcome p {
    color: #a8adbf;
    font-size: 16px;
}

.message {
    max-width: 760px;
    margin: 0 auto 22px;
    display: flex;
    gap: 12px;
}

.avatar {
    min-width: 36px;
    height: 36px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #202638;
}

.message.user .avatar {
    background: linear-gradient(135deg,#6c4cff,#9b59ff);
}

.message-text {
    line-height: 1.6;
    padding-top: 5px;
    color: #e6e8f0;
}

/* ПОЛЕ ВВОДА */

.input-area {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 20px;
    background: linear-gradient(
        transparent,
        rgba(8,11,20,0.95) 35%
    );
}

.input-box {
    max-width: 760px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(25,29,45,0.95);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 17px;
    padding: 8px 10px 8px 16px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.35);
}

.input-box textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 15px;
    min-height: 42px;
    max-height: 130px;
    padding-top: 11px;
}

.input-box textarea::placeholder {
    color: #777e94;
}

.attach {
    border: none;
    background: transparent;
    color: #969caf;
    font-size: 21px;
    cursor: pointer;
}

.send {
    width: 43px;
    height: 43px;
    border-radius: 12px;
    border: none;
    color: white;
    cursor: pointer;
    font-size: 18px;
    background: linear-gradient(135deg,#694cff,#00a8ff);
    transition: 0.2s;
}

.send:hover {
    transform: scale(1.06);
    box-shadow: 0 5px 20px rgba(100,80,255,0.4);
}

.footer-text {
    text-align: center;
    color: #656b7e;
    font-size: 11px;
    margin-top: 8px;
}

/* МОБИЛЬНАЯ ВЕРСИЯ */

@media(max-width: 700px) {

    .sidebar {
        width: 220px;
    }

    .welcome h1 {
        font-size: 29px;
    }

    .messages {
        padding-left: 15px;
        padding-right: 15px;
    }
}

@media(max-width: 550px) {

    .sidebar {
        display: none;
    }

    .topbar {
        padding: 0 15px;
    }

    .welcome {
        margin-top: 60px;
    }

    .welcome h1 {
        font-size: 26px;
    }

    .input-area {
        padding: 12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- ЛЕВАЯ ПАНЕЛЬ -->

    <aside class="sidebar">

        <div class="logo">
            ✦ <span>Art AI</span>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ Новый чат
        </button>

        <div class="history-title">
            История
        </div>

        <div class="history" id="history">
            <div class="chat-item">
                💬 Добро пожаловать
            </div>
        </div>

        <div class="bottom-menu">

            <button class="menu-button" onclick="clearHistory()">
                🗑 Очистить историю
            </button>

            <button class="menu-button" onclick="aboutAI()">
                ℹ О Art AI
            </button>

        </div>

    </aside>


    <!-- ЧАТ -->

    <main class="chat">

        <header class="topbar">

            <div>
                <div class="model-name">
                    Art AI
                </div>

                <div class="status">
                    ● Онлайн
                </div>
            </div>

            <div>
                ✦
            </div>

        </header>


        <section class="messages" id="messages">

            <div class="welcome" id="welcome">

                <div class="welcome-icon">
                    ✦
                </div>

                <h1>
                    Чем я могу помочь?
                </h1>

                <p>
                    Добро пожаловать в Art AI
                </p>

            </div>

        </section>


        <!-- ПОЛЕ ВВОДА -->

        <div class="input-area">

            <div class="input-box">

                <button class="attach" onclick="chooseFile()">
                    ＋
                </button>

                <textarea
                    id="input"
                    placeholder="Напишите сообщение..."
                    onkeydown="handleKey(event)"
                ></textarea>

                <button class="send" onclick="sendMessage()">
                    ➤
                </button>

            </div>

            <div class="footer-text">
                Art AI может допускать ошибки. Проверяйте важную информацию.
            </div>

        </div>

    </main>

</div>


<script>

let chats = JSON.parse(localStorage.getItem("artAIChats") || "[]");

const input = document.getElementById("input");
const messages = document.getElementById("messages");
const history = document.getElementById("history");

function saveChats() {
    localStorage.setItem("artAIChats", JSON.stringify(chats));
}

function newChat() {

    messages.innerHTML = `
        <div class="welcome" id="welcome">

            <div class="welcome-icon">
                ✦
            </div>

            <h1>
                Чем я могу помочь?
            </h1>

            <p>
                Новый разговор с Art AI
            </p>

        </div>
    `;

    input.value = "";
}

function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    addMessage(text, "user");

    input.value = "";

    chats.push({
        text: text,
        time: Date.now()
    });

    saveChats();

    updateHistory();

    setTimeout(() => {

        addMessage(
            "Это демонстрационная версия Art AI. На следующем этапе мы подключим настоящий искусственный интеллект, чтобы я мог отвечать на ваши сообщения.",
            "ai"
        );

    }, 600);
}

function addMessage(text, type) {

    const message = document.createElement("div");

    message.className =
        "message " + (type === "user" ? "user" : "ai");

    message.innerHTML = `
        <div class="avatar">
            ${type === "user" ? "👤" : "✦"}
        </div>

        <div class="message-text">
            ${escapeHTML(text)}
        </div>
    `;

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;
}

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

function handleKey(event) {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();
    }
}

function updateHistory() {

    history.innerHTML = "";

    if (chats.length === 0) {

        history.innerHTML =
            '<div class="chat-item">История пуста</div>';

        return;
    }

    chats.slice().reverse().forEach((chat, index) => {

        const item = document.createElement("div");

        item.className = "chat-item";

        item.textContent =
            "💬 " + chat.text.substring(0, 30);

        history.appendChild(item);

    });
}

function clearHistory() {

    if (confirm("Удалить всю историю?")) {

        chats = [];

        saveChats();

        updateHistory();

        newChat();
    }
}

function aboutAI() {

    alert(
        "Art AI\n\n" +
        "Персональный AI-чат.\n\n" +
        "Сейчас работает интерфейс сайта. " +
        "Подключение настоящего ИИ будет следующим этапом."
    );
}

function chooseFile() {

    alert(
        "Загрузка файлов будет подключена на следующем этапе."
    );
}

updateHistory();

</script>

</body>
</html>
