<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Art AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(45, 80, 255, 0.35), transparent 35%),
        radial-gradient(circle at 80% 70%, rgba(180, 45, 255, 0.30), transparent 35%),
        #070a12;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* Боковая панель */
    .sidebar {
      width: 216px;
      background: rgba(10, 14, 28, 0.96);
      border-right: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      padding: 18px 12px;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 28px;
      padding: 0 10px;
      color: #ffffff;
    }

    .logo span {
      color: #6d7cff;
    }

    .new-chat {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.06);
      color: white;
      border-radius: 11px;
      padding: 12px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 22px;
    }

    .new-chat:hover {
      background: rgba(255,255,255,0.10);
    }

    .history-title {
      color: #8b91a8;
      font-size: 12px;
      margin: 0 8px 10px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
    }

    .history-item {
      padding: 10px;
      margin-bottom: 4px;
      border-radius: 8px;
      color: #dce1f2;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      background: rgba(255,255,255,0.05);
    }

    .empty-history {
      color: #777d92;
      font-size: 13px;
      padding: 8px;
    }

    .sidebar-bottom {
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 15px;
    }

    .sidebar-button {
      display: block;
      width: 100%;
      background: transparent;
      border: 0;
      color: #b7bdd1;
      padding: 10px 8px;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
    }

    .sidebar-button:hover {
      color: white;
    }

    /* Основная часть */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 52px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      background: rgba(8, 11, 20, 0.5);
      display: flex;
      align-items: center;
      padding: 0 22px;
    }

    .topbar-title {
      font-weight: bold;
      font-size: 14px;
    }

    .online {
      color: #43df8b;
      font-size: 11px;
      margin-top: 3px;
    }

    .chat {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .welcome {
      position: absolute;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 90%;
    }

    .welcome-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      border-radius: 17px;
      background: linear-gradient(135deg, #5865ff, #22b8ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      box-shadow: 0 0 35px rgba(79, 125, 255, 0.35);
    }

    .welcome h1 {
      font-size: 31px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #9299af;
      font-size: 14px;
    }

    .messages {
      height: 100%;
      overflow-y: auto;
      padding: 25px 20px 130px;
      display: none;
    }

    .messages.active {
      display: block;
    }

    .message {
      display: flex;
      margin-bottom: 18px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-content {
      max-width: min(760px, 85%);
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .message-content {
      background: #3158ff;
    }

    .message.ai .message-content {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.07);
    }

    /* Поле ввода */
    .input-area {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(720px, calc(100% - 30px));
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(25, 30, 50, 0.96);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 15px;
      padding: 7px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }

    .attach {
      width: 36px;
      height: 36px;
      border: 0;
      background: transparent;
      color: #9097ab;
      font-size: 22px;
      cursor: pointer;
      border-radius: 10px;
    }

    .attach:hover {
      background: rgba(255,255,255,0.05);
      color: white;
    }

    .input {
      flex: 1;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      font-size: 14px;
      padding: 10px 4px;
    }

    .input::placeholder {
      color: #73798d;
    }

    .send {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #5061ff, #24a9ff);
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    .send:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .disclaimer {
      text-align: center;
      color: #5f6579;
      font-size: 10px;
      margin-top: 6px;
    }

    .typing {
      opacity: 0.7;
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 180px;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .message-content {
        max-width: 92%;
      }
    }

    @media (max-width: 560px) {
      .sidebar {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <aside class="sidebar">
      <div class="logo">✦ <span>Art AI</span></div>

      <button class="new-chat" id="newChat">＋ Новый чат</button>

      <div class="history-title">История</div>
      <div class="history" id="history"></div>

      <div class="sidebar-bottom">
        <button class="sidebar-button" id="clearHistory">
          🗑 Очистить историю
        </button>

        <button class="sidebar-button" id="about">
          ℹ О Art AI
        </button>
      </div>
    </aside>

    <main class="main">

      <header class="topbar">
        <div>
          <div class="topbar-title">Art AI</div>
          <div class="online">● Онлайн</div>
        </div>
      </header>

      <section class="chat">

        <div class="welcome" id="welcome">
          <div class="welcome-icon">✦</div>
          <h1>Чем я могу помочь?</h1>
          <p>Новый разговор с Art AI</p>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-area">
          <div class="input-box">

            <button class="attach" id="attach" title="Прикрепить файл">
              ＋
            </button>

            <input
              class="input"
              id="input"
              type="text"
              placeholder="Напишите сообщение..."
              autocomplete="off"
            >

            <button class="send" id="send" title="Отправить">
              ➤
            </button>

          </div>

          <div class="disclaimer">
            Art AI может допускать ошибки. Проверяйте важную информацию.
          </div>
        </div>

      </section>

    </main>
  </div>

  <script>
    const WORKER_URL =
      "https://art-ai-api.artemii-lazutin.workers.dev";

    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const history = document.getElementById("history");
    const newChat = document.getElementById("newChat");
    const clearHistory = document.getElementById("clearHistory");
    const about = document.getElementById("about");
    const attach = document.getElementById("attach");

    let currentMessages = [];

    let savedChats =
      JSON.parse(localStorage.getItem("art_ai_chats") || "[]");

    function saveChats() {
      localStorage.setItem(
        "art_ai_chats",
        JSON.stringify(savedChats)
      );
    }

    function renderHistory() {
      history.innerHTML = "";

      if (!savedChats.length) {
        history.innerHTML =
          '<div class="empty-history">История пуста</div>';
        return;
      }

      savedChats.forEach((chat, index) => {
        const item = document.createElement("div");
        item.className = "history-item";
        item.textContent = chat.title || "Новый чат";

        item.onclick = () => {
          loadChat(index);
        };

        history.appendChild(item);
      });
    }

    function loadChat(index) {
      const chat = savedChats[index];

      currentMessages =
        Array.isArray(chat.messages)
          ? [...chat.messages]
          : [];

      renderMessages();
    }

    function createMessageElement(role, text) {
      const wrapper = document.createElement("div");
      wrapper.className =
        "message " + (role === "user" ? "user" : "ai");

      const content = document.createElement("div");
      content.className = "message-content";
      content.textContent = text;

      wrapper.appendChild(content);

      return wrapper;
    }

    function renderMessages() {
      messages.innerHTML = "";

      if (!currentMessages.length) {
        welcome.style.display = "block";
        messages.classList.remove("active");
        return;
      }

      welcome.style.display = "none";
      messages.classList.add("active");

      currentMessages.forEach(msg => {
        messages.appendChild(
          createMessageElement(
            msg.role,
            msg.content
          )
        );
      });

      messages.scrollTop = messages.scrollHeight;
    }

    function saveCurrentChat() {
      if (!currentMessages.length) {
        return;
      }

      const firstUserMessage =
        currentMessages.find(
          m => m.role === "user"
        );

      const title =
        firstUserMessage?.content
          ?.slice(0, 45) ||
        "Новый чат";

      savedChats.unshift({
        title,
        messages: currentMessages
      });

      if (savedChats.length > 50) {
        savedChats = savedChats.slice(0, 50);
      }

      saveChats();
      renderHistory();
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text || send.disabled) {
        return;
      }

      input.value = "";

      currentMessages.push({
        role: "user",
        content: text
      });

      renderMessages();

      send.disabled = true;
      input.disabled = true;

      const typing = {
        role: "assistant",
        content: "Печатает..."
      };

      messages.appendChild(
        createMessageElement(
          "ai",
          typing.content
        )
      );

      messages.lastElementChild
        .querySelector(".message-content")
        .classList.add("typing");

      messages.scrollTop = messages.scrollHeight;

      try {
        const response = await fetch(
          WORKER_URL,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              messages: currentMessages
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data?.details ||
            data?.error ||
            "Ошибка сервера"
          );
        }

        const answer =
          data?.answer ||
          "Я не получил ответ.";

        currentMessages.push({
          role: "assistant",
          content: answer
        });

        renderMessages();

        saveCurrentChat();

      } catch (error) {

        currentMessages.push({
          role: "assistant",
          content:
            "Не удалось получить ответ от AI.\n\n" +
            "Ошибка: " +
            error.message
        });

        renderMessages();

      } finally {
        send.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    send.addEventListener(
      "click",
      sendMessage
    );

    input.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();
          sendMessage();
        }
      }
    );

    newChat.addEventListener(
      "click",
      () => {
        currentMessages = [];
        renderMessages();
        input.focus();
      }
    );

    clearHistory.addEventListener(
      "click",
      () => {
        if (
          confirm(
            "Удалить всю историю чатов?"
          )
        ) {
          savedChats = [];
          localStorage.removeItem(
            "art_ai_chats"
          );
          currentMessages = [];
          renderHistory();
          renderMessages();
        }
      }
    );

    about.addEventListener(
      "click",
      () => {
        alert(
          "Art AI\n\n" +
          "Ваш AI-помощник."
        );
      }
    );

    attach.addEventListener(
      "click",
      () => {
        alert(
          "Прикрепление файлов подключим следующим этапом."
        );
      }
    );

    renderHistory();
    renderMessages();
  </script>
</body>
</html>
